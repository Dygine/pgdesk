<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1E4D" />
    <!--
      Declare the scheme this app is actually built in.

      Android WebView and Chrome apply "force dark" to any page that does not
      say. The algorithm inverts backgrounds but cannot invert an image, so the
      logo's navy "PG" disappeared into black and inputs lost their fill - the
      app looked broken on every dark-mode handset, without a line of dark-mode
      code existing anywhere in it.

      `light` opts out. The app renders as designed on a dark-mode phone. When a
      real dark theme is built this becomes `light dark`.
    -->
    <meta name="color-scheme" content="light" />
    <title>PGuru — PG & Hostel Management</title>
    <link rel="icon" href="/pgguru-icon.png" />
    <link rel="apple-touch-icon" href="/pgguru-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Branded loading screen shown until the app mounts (also what the APK
         shows right after the native splash while the web app boots). React
         renders into #root and replaces this automatically. */
      #pg-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: #ffffff;
      }
      #pg-splash img { width: min(320px, 68vw); height: auto; }
      #pg-splash .sp {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #DDE1F7; border-top-color: #373DA6;
        animation: pg-spin .8s linear infinite;
      }
      @keyframes pg-spin { to { transform: rotate(360deg); } }
    </style>
    <!--
      Structured data.

      This tells Google what the thing at this URL actually *is*, rather than
      leaving it to infer from prose. It matters more here than on most sites
      because "PG Guru" already means two established things on the internet -
      a politics and business news portal, and an education news site - and the
      only way to be understood as the third is to say so in a format search
      engines read literally.

      Keep the name, the prices and the URL in step with what the site shows.
      Marked-up prices that contradict the visible page are a manual-action
      risk, not a clever trick.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://pgguru.in/#organization",
          "name": "PGuru",
          "url": "https://pgguru.in/",
          "logo": "https://pgguru.in/pgguru-logo.png",
          "areaServed": { "@type": "Country", "name": "India" }
        },
        {
          "@type": "WebSite",
          "@id": "https://pgguru.in/#website",
          "url": "https://pgguru.in/",
          "name": "PGuru",
          "publisher": { "@id": "https://pgguru.in/#organization" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "SoftwareApplication",
          "name": "PGuru",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Android, Web",
          "url": "https://pgguru.in/",
          "description": "PG and hostel management software for Indian owners: rooms, beds, residents, rent, complaints and a public listing that fills empty beds. A portal for every tenant.",
          "publisher": { "@id": "https://pgguru.in/#organization" },
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "INR",
            "lowPrice": "1499",
            "highPrice": "19999",
            "offerCount": "4"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pg-splash">
        <img src="/pgguru-logo.png" alt="PGuru" />
        <div class="sp"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
