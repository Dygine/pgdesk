
/**
 * Release signing.
 *
 * Nothing secret lives in this repository. Gradle looks for a
 * keystore.properties beside this file (gitignored) and falls back to
 * environment variables, which is what a CI runner supplies. If neither is
 * present the release signingConfig is simply not created, so `assembleDebug`
 * and every other task still work on a fresh clone.
 *
 * See ANDROID.md -> "Release signing" for how to create the keystore.
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def storeFilePath = keystoreProps['storeFile'] ?: System.getenv('PGGURU_KEYSTORE')
def storePassword_ = keystoreProps['storePassword'] ?: System.getenv('PGGURU_KEYSTORE_PASSWORD')
def keyAlias_      = keystoreProps['keyAlias'] ?: System.getenv('PGGURU_KEY_ALIAS')
def keyPassword_   = keystoreProps['keyPassword'] ?: System.getenv('PGGURU_KEY_PASSWORD')
def hasSigning     = storeFilePath != null && file(storeFilePath).exists()

apply plugin: 'com.android.application'

// Read from package.json so a single `npm version` bump moves the web bundle,
// the update manifest and the APK together. Three hand-edited numbers is three
// chances to ship an APK that reports the wrong version to the update check.
def pkg = new groovy.json.JsonSlurper().parseText(file("../../package.json").text)
def pgguruVersion = pkg.version
// versionCode must be a monotonically increasing integer, so 1.2.3 -> 10203.
def parts = pgguruVersion.tokenize('.')
def pgguruVersionCode = (parts[0] as int) * 10000 + (parts[1] as int) * 100 + (parts[2] as int)

android {
    namespace = "in.kredo.pgguru"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.kredo.pgguru"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pgguruVersionCode
        versionName pgguruVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        /*
         * Ship only the CPU types real phones have.
         *
         * The barcode scanner (ML Kit) carries a native library per
         * architecture, about 5 MB each. Four of them is 20 MB, and half of
         * that is x86 and x86_64 - which exist for emulators, not handsets. No
         * phone in India runs an x86 Android build.
         *
         * The cost is that this APK will not install on a standard Windows
         * emulator, which is x86_64. Add 'x86_64' back to this list when
         * testing that way; keep it out of what gets published.
         */
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(storeFilePath)
                storePassword storePassword_
                keyAlias keyAlias_
                keyPassword keyPassword_
            }
        }
    }

    buildTypes {
        release {
            // Shrinking is on for release: the bundle is mostly the web app, but
            // the Java side still benefits and it keeps the AAB smaller.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("No keystore configured - the release build will be UNSIGNED. See ANDROID.md.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
